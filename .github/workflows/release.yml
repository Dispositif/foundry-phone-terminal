# Publishes the module on each GitHub release: updates module.json (version, manifest, download),
# builds the zip and attaches both files to the release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version and URLs in module.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg m "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg d "https://github.com/$REPO/releases/download/$TAG/soren-phone-terminal.zip" \
             '.version=$v | .manifest=$m | .download=$d' module.json > module.tmp && mv module.tmp module.json

      - name: Build zip
        run: zip -r soren-phone-terminal.zip module.json README.md README.fr.md CHANGELOG.md LICENSE scripts styles lang sounds templates icons

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" module.json soren-phone-terminal.zip --clobber
